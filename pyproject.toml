[project]
name = "graphone-intelligence-pipeline"
version = "0.1.0"
description = "Async AI Intelligence Graph ingestion platform (GraphOne / FrontierAtlas AI Engineer assessment)"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

# pytest config lives in pytest.ini (single source of truth, avoids the
# "ignoring pytest config in pyproject.toml" warning when both are present)

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
