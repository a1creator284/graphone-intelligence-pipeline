services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphone
      POSTGRES_PASSWORD: graphone
      POSTGRES_DB: graphone
    ports:
      - "5432:5432"
    volumes:
      - graphone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://graphone:graphone@postgres:5432/graphone
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.main", "--help"]

volumes:
  graphone_pg_data:
